syntax = "proto3";
package tesseract.bridge.v1;
// This is a format contract, not evidence of an installed gRPC server.
message TelemetryEvent {
  string schema_version = 1;
  string event_id = 2;
  string source_carrier = 3;
  string observed_at_utc = 4;
  string event_type = 5;
  string source_sha256 = 6;
  string agent_id = 7;
  string request_id = 8;
  string causal_parent_event_id = 9;
  bool consequence_verified = 10;
  string receipt_ref = 11;
}
message TelemetryReceipt {
  string event_id = 1;
  bool accepted = 2;
  string readback_ref = 3;
}
service TelemetryIngest {
  rpc Submit(TelemetryEvent) returns (TelemetryReceipt);
}
