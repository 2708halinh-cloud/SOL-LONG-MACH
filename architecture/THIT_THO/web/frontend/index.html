<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>THỊT · THỔ | TESSERACT</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:auto;padding:25px;color:#e8eff9;background:#101825}
section{border:1px solid #455976;padding:18px;margin:22px 0;border-radius:12px}
.metrics{display:flex;flex-wrap:wrap;gap:12px}.metrics p{flex:1;min-width:120px;padding:12px;border:1px solid #394e65}
strong{display:block;font-size:26px;color:#c6aa7a}button{padding:10px;border-radius:8px;background:#263950;color:#fff;border:1px solid #c6aa7a}
</style></head><body><header><h1>THỊT · THỔ</h1><p>TESSERACT — thực thể, quan hệ, vật mang</p></header>
<main><section><h2>Quan hệ dữ liệu</h2><p id="status" role="status">Đang đọc cơ sở E-R...</p>
<div class="metrics"><p><strong id="entities">—</strong>Thực thể</p><p><strong id="relations">—</strong>Quan hệ</p>
<p><strong id="sources">—</strong>Nguồn xuất xứ</p></div>
<button id="reload" type="button">Đọc lại nguồn</button></section>
<section><h2>Phân tầng</h2>Web · SQLite E-R · Cầu nối · Thiết bị · Vật mang.
<p>Chỉ đọc số liệu tổng hợp, không điều khiển OS hay công bố dữ liệu thô.</p></section></main>
<script>
async function refresh(){const s=document.getElementById('status');s.textContent='Đang kiểm tra...';
try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('Nguồn chưa sẵn sàng');
const d=await r.json();for(const k of ['entities','relations','sources'])
document.getElementById(k).textContent=Number.isInteger(d[k])?d[k].toLocaleString('vi-VN'):'—';
s.textContent='Đã đọc dữ liệu E-R';}catch(e){s.textContent=e.message;}}
document.getElementById('reload').addEventListener('click',refresh);refresh();
</script></body></html>
