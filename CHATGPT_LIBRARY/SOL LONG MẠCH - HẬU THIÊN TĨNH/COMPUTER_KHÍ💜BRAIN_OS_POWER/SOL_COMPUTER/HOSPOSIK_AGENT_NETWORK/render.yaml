services:
  - type: web
    name: hosposik-agent-network
    runtime: node
    plan: starter
    region: singapore
    rootDir: "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/SOL_COMPUTER/HOSPOSIK_AGENT_NETWORK"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: hosposik-memory
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOSPOSIK_PUBLIC_MODE
        value: "true"
      - key: HOSPOSIK_DATA_DIR
        value: /var/data
      - key: HOSPOSIK_TOKEN
        generateValue: true
      - key: NODE_VERSION
        value: 24
