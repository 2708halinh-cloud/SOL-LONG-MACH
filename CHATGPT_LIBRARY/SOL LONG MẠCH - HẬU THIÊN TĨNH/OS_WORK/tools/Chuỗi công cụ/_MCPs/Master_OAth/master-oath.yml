name: Master OAth auth routing tests
on:
  push:
    paths:
      - 'CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/Chuỗi công cụ/_MCPs/Master_OAth/**'
      - '.github/workflows/master-oath.yml'
  pull_request:
    paths:
      - 'CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/Chuỗi công cụ/_MCPs/Master_OAth/**'
      - '.github/workflows/master-oath.yml'
  workflow_dispatch:
jobs:
  master-oath-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Master OAth without credentials or network
        run: |
          python -m unittest discover -s 'CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/Chuỗi công cụ/_MCPs/Master_OAth/tests' -p 'test_master_oath*.py' -v
