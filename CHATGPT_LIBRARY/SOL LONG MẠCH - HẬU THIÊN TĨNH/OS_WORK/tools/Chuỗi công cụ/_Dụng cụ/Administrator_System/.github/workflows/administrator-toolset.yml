name: SOL Administrator System's × Toolset
on:
  push:
    branches: [main]
    paths:
      - "runtime/administrator_toolset.py"
      - "runtime/master_teacher_ethics.py"
      - "runtime/sol_toolset_semantic_router.py"
      - "tests/test_administrator_toolset.py"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/Chuỗi công cụ/_MCPs/AZURE_DEVOPS_MCP_CORE/**"
      - ".github/workflows/administrator-toolset.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-project-governance-toolset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile operational entrypoint
        run: python -m py_compile runtime/administrator_toolset.py
      - name: Verify source authority and 97 Toolset routes
        run: python runtime/administrator_toolset.py --repo-root .
      - name: Exercise source-bound Toolset routing
        run: python runtime/administrator_toolset.py --repo-root . --task 'Liệt kê dự án và nhóm dự án'
      - name: Test authorization boundaries
        run: python -m unittest discover -s tests -p test_administrator_toolset.py -v