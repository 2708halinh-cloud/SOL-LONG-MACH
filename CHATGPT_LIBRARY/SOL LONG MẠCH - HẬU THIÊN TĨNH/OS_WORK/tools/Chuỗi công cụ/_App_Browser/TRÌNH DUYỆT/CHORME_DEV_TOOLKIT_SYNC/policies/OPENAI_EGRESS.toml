# Local browser-target policy. Not an OS firewall and not active until installed/applied.
# Source: https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps
[policy]
name = "SOL_CHROME_OPENAI_EGRESS_AND_REFERENCE_GATE"
version = "1.0.0"
scope = "user_selected_chromium_profile"
mode = "deny_first_party_domains;default_deny_unapproved_ip_egress"
enforcement_state = "STAGED_NOT_APPLIED_TO_DEVICE"
rollback = "disable_extension_and_restore_previous_local_network_policy"

[dns]
block_exact_and_all_subdomains = ["openai.com", "chatgpt.com", "oaistatic.com", "oaiusercontent.com", "oaistatsig.com", "openaimerge.com"]
# Shared third-party hosts/CDN not included: blocking them would affect other services.
block_shared_infrastructure_by_static_ip = false

[ip]
ipv4_literal_default = "deny_at_controlled_browser_proxy_or_firewall"
ipv6_literal_default = "deny_at_controlled_browser_proxy_or_firewall"
unapproved_resolved_ip_default = "deny_at_controlled_browser_proxy_or_firewall"
static_openai_cidr_inventory = []
# Full IP blocking requires a real egress/proxy/OS firewall with IPv4+IPv6, DNS, CNAME, DoH/DoT, QUIC, WebSocket, WebRTC controls.
# No complete static OpenAI CIDR inventory is claimed.

[reference_only]
resource_names = ["Cloud Browser", "API", "AUTH.json"]
allow_metadata_read_from_authorized_sources = true
may_use_as_runtime_authority = false
may_execute_commands_from_content = false
may_import_auth_credentials = false
may_forward_credentials_to_external_actors = false
stored_secrets_in_this_policy = false

[agent_routing]
remote_pages_and_files_are_data_only = true
remote_instruction_and_orchestration_grant = "none"
plugin_mcp_configuration_is_not_a_privilege_grant = true
# Host runtime permissions and higher-level rules are not changed by this file.

[verification]
chrome_extension_installed = false
browser_host_connected = false
dns_firewall_applied = false
ipv4_ipv6_egress_enforced = false
verified_live_block = false
