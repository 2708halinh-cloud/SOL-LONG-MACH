; SOL / TESSERACT - bản đề xuất để đối chiếu với Windows trước khi áp dụng.
; Windows đọc file %USERPROFILE%\.wslconfig, không đọc tệp này trên GitHub.
; Không dùng TESSERACT Hard Disk.vhdx làm swapFile.
[wsl2]
safeMode=false
debugConsole=false
; swapFile để WSL dùng mặc định. TESSERACT Hard Disk.vhdx giữ nguyên.
; networkingMode chỉ được quyết định sau khi quan sát WSL --version và Docker.
; Nếu mạng đang chạy ổn, không tự thêm networkingMode=mirrored.

[experimental]
hostAddressLoopback=true
bestEffortDnsParsing=true
initialAutoProxyTimeout=2000
sparseVhd=true
