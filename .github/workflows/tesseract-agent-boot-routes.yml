name: TESSERACT Agent BOOT Routes
on:
  push:
    paths:
      - "runtime/tesseract_agent_boot.py"
      - "tests/test_tesseract_agent_boot.py"
      - "CONFIG_SOL/TESSERACT_AGENT_BOOT_ROUTES_CURRENT.json"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/TOOLS_ROUTER_CURRENT.json"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/AZURE_DEVOPS_MCP_CORE/**"
      - ".github/workflows/tesseract-agent-boot-routes.yml"
  pull_request:
    paths:
      - "runtime/tesseract_agent_boot.py"
      - "tests/test_tesseract_agent_boot.py"
      - "CONFIG_SOL/TESSERACT_AGENT_BOOT_ROUTES_CURRENT.json"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/TOOLS_ROUTER_CURRENT.json"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/AZURE_DEVOPS_MCP_CORE/**"
jobs:
  validate-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source probe
        run: python -m py_compile runtime/tesseract_agent_boot.py
      - name: Validate shared Hands/Azure Toolset boot regression
        run: python -m unittest discover -s tests -p 'test_tesseract_agent_boot.py' -v
      - name: Source readback
        run: python runtime/tesseract_agent_boot.py --root .
