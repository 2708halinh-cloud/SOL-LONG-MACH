name: sol-khi-single-computer-audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/verify_computer_khi_single_root.py"
      - "tests/test_verify_computer_khi_single_root.py"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/**"
      - ".github/workflows/verify-computer-khi-one-root.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-computer-readonly-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test the one-COMPUTER classification
        run: python3 -m unittest discover -s tests -p "test_verify_computer_khi_single_root.py" -v
      - name: Read current source topology without moving files
        run: python3 scripts/verify_computer_khi_single_root.py
      - name: Explain migration gate
        run: |
          echo "MIGRATION_PENDING is an expected read-only finding until the original referenced data/workflows are migrated and read back."
          echo "The unit tests verify no false positive for consolidated status."
