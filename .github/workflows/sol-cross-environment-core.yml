name: SOL Cross-Environment Core Regression

on:
  push:
    branches: [main]
    paths:
      - "runtime/sol_multienvironment_core.py"
      - "tests/test_sol_multienvironment_core.py"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/AZURE_DEVOPS_MCP_CORE/CROSS_ENVIRONMENT_CORE_APPLIED_20261016.md"
      - ".github/workflows/sol-cross-environment-core.yml"
  pull_request:
    paths:
      - "runtime/sol_multienvironment_core.py"
      - "tests/test_sol_multienvironment_core.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile runtime/sol_multienvironment_core.py
      - name: Regression across independent provider identities
        run: python -m unittest discover -s tests -p "test_sol_multienvironment_core.py" -v
