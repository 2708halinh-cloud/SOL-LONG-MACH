name: R-014 Root Carrier Protection
on:
  push:
    branches: [main]
    paths:
      - 'runtime/destructive_gate.py'
      - 'runtime/continuity_guard.py'
      - 'tests/test_r014_root_protection.py'
      - 'tests/test_continuity_guard.py'
      - '.github/workflows/r014-root-carrier-protection.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: read

jobs:
  harden-original-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deny repeated ROOTS and Drive-ID destruction
        run: python -m unittest discover -s tests -p 'test_r014_root_protection.py' -v
      - name: Verify continuity caller honors destructive gate
        run: python -m unittest discover -s tests -p 'test_continuity_guard.py' -v
