name: Windows survival - independent OPEN continuation
on:
  push:
    branches: [main]
    paths:
      - 'runtime/cloud_survival_scheduler.py'
      - 'runtime/windows_c_survival_probe.ps1'
      - 'tests/test_cloud_survival_scheduler.py'
      - 'runtime/hellohabit_t005_adapter.py'
      - 'tests/test_hellohabit_t005_adapter.py'
      - 'integrations/android/hellohabit/**'
      - 'integrations/hellocheck/**'
      - 'CURRENT_RUNTIME/OPEN_TASKS_CURRENT.json'
      - '.github/workflows/windows-survival-cloud-continuity.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-survival-independent-continuation
  cancel-in-progress: false

jobs:
  continue-without-personal-devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard existing OPEN ledger and critical C threshold
        run: python -m unittest discover -s tests -p 'test_cloud_survival_scheduler.py' -v
      - name: Validate HelloHabit T005 split adapter without claiming app installation
        run: python -m unittest discover -s tests -p 'test_hellohabit_t005_adapter.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Compile and test live HelloCheck Bitcoin TestNet Go sources
        working-directory: integrations/hellocheck
        run: |
          go mod download
          go mod verify
          go test ./... -v
          go vet ./...
          go build ./cmd/hellocheck
          test -x ./hellocheck
          ./hellocheck address --hash160 0000000000000000000000000000000000000000
          rm -f ./hellocheck
      - name: Execute source-bound cloud continuation without touching Windows
        run: |
          mkdir -p readback
          python runtime/cloud_survival_scheduler.py --repo-root . --output readback/SURVIVAL_OPEN_CONTINUATION_CURRENT.json
      - name: Retain runner execution receipt even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-survival-open-continuation
          path: readback/SURVIVAL_OPEN_CONTINUATION_CURRENT.json
          retention-days: 30
          if-no-files-found: warn
