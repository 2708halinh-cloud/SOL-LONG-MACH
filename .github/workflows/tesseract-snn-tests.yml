name: TESSERACT CPU SNN and Sol Brain tests

on:
  push:
    branches: [main, architecture/tesseract-motherboard-snn, feature/tesseract-os-mainboard]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run TESSERACT and Digital Nervous System tests
        run: |
          python -m unittest discover -s tests -p 'test_tesseract_*.py' -v
          python -m unittest discover -s tests -p 'test_digital_nervous_system.py' -v
          python -m unittest tests.test_sol_brain -v
