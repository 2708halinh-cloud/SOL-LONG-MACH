name: SOL Library Stone Topology

on:
  push:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/**"
      - "MEMORY_*/**"
      - "runtime/tesseract_agent_boot.py"
      - "tests/test_sol_library_stone_topology.py"
      - ".github/workflows/sol-library-stone-topology.yml"
  pull_request:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/**"
      - "MEMORY_*/**"
      - "runtime/tesseract_agent_boot.py"
      - "tests/test_sol_library_stone_topology.py"
      - ".github/workflows/sol-library-stone-topology.yml"
jobs:
  verify-stone-folders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Library topology
        run: python -m unittest discover -s tests -p 'test_sol_library_stone_topology.py' -v
      - name: Verify read-only archive adapter safety
        run: python -m unittest tests.test_sol_archive_10_formats -v
      - name: Verify native archive fixtures without extraction
        run: python 'CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/.sandbox-bin/sol_archive_10_formats.py' --fixture-test
      - name: Verify agent boot routes
        run: python -m unittest discover -s tests -p 'test_tesseract_agent_boot.py' -v
