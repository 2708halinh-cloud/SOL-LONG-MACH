name: High-Threshold Secret Exposure Guard
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read repository as unprivileged checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan tracked content without printing secrets
        run: python3 security/secret_exposure_guard.py
