name: High-Threshold Secret Exposure Guard
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtain source snapshot without malformed git submodules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-tree"
          curl --fail --show-error --silent --location --retry 2 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$RUNNER_TEMP/source-tree.tar.gz"
          tar -xzf "$RUNNER_TEMP/source-tree.tar.gz" --strip-components=1 --no-same-owner -C "$RUNNER_TEMP/source-tree"
      - name: Verify .gitmodules paths exactly match tracked gitlinks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          source = Path(os.environ["RUNNER_TEMP"]) / "source-tree" / ".gitmodules"
          if not source.is_file():
              raise SystemExit("FAIL: .gitmodules is missing from the source snapshot")

          declared = []
          in_submodule = False
          for raw in source.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line.startswith("[submodule "):
                  in_submodule = True
              elif line.startswith("["):
                  in_submodule = False
              elif in_submodule and line.startswith("path") and "=" in line:
                  declared.append(line.split("=", 1)[1].strip())

          request = Request(
              f"https://api.github.com/repos/{repo}/git/trees/{sha}?recursive=1",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "SOL-LONG-MACH-gitmodules-path-guard",
              },
          )
          with urlopen(request, timeout=20) as response:
              tree_payload = json.load(response)
          if tree_payload.get("truncated"):
              raise SystemExit("FAIL: GitHub tree response is truncated; cannot verify all gitlinks")

          entries = tree_payload.get("tree", [])
          gitlinks = {
              item["path"] for item in entries
              if item.get("mode") == "160000" or item.get("type") == "commit"
          }
          declared_set = set(declared)
          if len(declared) != len(declared_set):
              raise SystemExit("FAIL: duplicate submodule path declarations")
          if declared_set != gitlinks:
              missing = sorted(gitlinks - declared_set)
              stale = sorted(declared_set - gitlinks)
              print(json.dumps({
                  "result": "FAIL",
                  "commit": sha,
                  "gitlinks_missing_from_gitmodules": missing,
                  "declared_paths_without_gitlinks": stale,
              }, ensure_ascii=False))
              raise SystemExit(1)

          print(json.dumps({
              "result": "PASS",
              "commit": sha,
              "declared_submodule_paths": len(declared),
              "tracked_gitlinks": len(gitlinks),
              "paths": sorted(gitlinks),
          }, ensure_ascii=False))
          PY
      - name: Scan the full source snapshot without printing secret bytes
        run: python3 "$RUNNER_TEMP/source-tree/security/secret_exposure_guard.py"
