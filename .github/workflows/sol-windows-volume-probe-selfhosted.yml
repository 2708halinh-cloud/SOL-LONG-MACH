name: sol-windows-volume-probe-selfhosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sol-windows-volume-probe-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-only-disk-state:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Probe actual Windows C and D and publish minimal receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME.ToUpperInvariant() -ne 'DESKTOP-86ITNQ4') {
            throw 'UNEXPECTED_HOST'
          }
          $disks = @(Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DriveType=3")
          $volumes = @{}
          foreach ($letter in @('C','D')) {
            $d = $disks | Where-Object { $_.DeviceID -eq ($letter + ':') } | Select-Object -First 1
            if ($null -eq $d) {
              $volumes[$letter] = [ordered]@{ present = $false }
            } else {
              $size = [double]$d.Size
              $free = [double]$d.FreeSpace
              $volumes[$letter] = [ordered]@{
                present = $true
                filesystem = [string]$d.FileSystem
                size_gib = [math]::Round($size / 1GB, 2)
                free_gib = [math]::Round($free / 1GB, 2)
                used_percent = if ($size -gt 0) { [math]::Round(100 * ($size - $free) / $size, 1) } else { $null }
              }
            }
          }
          $receipt = [ordered]@{
            schema = 'SOL_WINDOWS_VOLUME_READONLY_RECEIPT/1.0'
            origin = 'GITHUB_ACTIONS_SELF_HOSTED_WINDOWS'
            host_match = $true
            observed_utc = (Get-Date).ToUniversalTime().ToString('o')
            source = 'Win32_LogicalDisk/DriveType=3'
            read_only = $true
            volumes = $volumes
            d_data_recovery_verified = $false
          }
          $payload = ($receipt | ConvertTo-Json -Depth 10)
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/CURRENT_RUNTIME/WINDOWS_VOLUME_PROBE_CURRENT.json"
          $headers = @{
            'Authorization' = "Bearer $env:GH_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'sol-windows-volume-probe'
          }
          $sha = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri $api -Headers $headers -TimeoutSec 15
            $sha = $existing.sha
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($payload + "`n")
          $body = @{
            message = 'Windows self-hosted runner volume readback (C/D only)'
            content = [Convert]::ToBase64String($bytes)
            branch = 'main'
          }
          if ($sha) { $body.sha = $sha }
          $response = Invoke-RestMethod -Method Put -Uri $api -Headers $headers -Body ($body | ConvertTo-Json -Depth 5) -ContentType 'application/json' -TimeoutSec 20
          if (-not $response.content.sha) { throw 'RECEIPT_NOT_CONFIRMED' }
          Write-Host "VOLUME_RECEIPT_SHA=$($response.content.sha)"
