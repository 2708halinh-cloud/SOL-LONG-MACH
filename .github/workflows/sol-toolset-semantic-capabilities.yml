name: SOL Toolset Goal-First Capability Regression
on:
  push:
    branches: [main]
    paths:
      - "runtime/sol_toolset_semantic_router.py"
      - "tests/test_sol_toolset_semantic_router.py"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/AZURE_DEVOPS_MCP_CORE/SOL_NINE_CAPABILITY_FAMILIES.json"
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/OS_WORK/tools/TOOLS_ROUTER_CURRENT.json"
      - ".github/workflows/sol-toolset-semantic-capabilities.yml"
  pull_request:
    paths:
      - "runtime/sol_toolset_semantic_router.py"
      - "tests/test_sol_toolset_semantic_router.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-capability-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile goal-first semantic selector
        run: python -m py_compile runtime/sol_toolset_semantic_router.py
      - name: Verify nine transferable families and no Azure capability overclaim
        run: python -m unittest discover -s tests -p 'test_sol_toolset_semantic_router.py' -v
      - name: Demonstrate intention-to-capability selection
        run: python runtime/sol_toolset_semantic_router.py --task 'Tìm lần lặp và năng lực còn lại của nhóm dự án'
