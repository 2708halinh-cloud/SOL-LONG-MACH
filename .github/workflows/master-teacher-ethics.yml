name: SOL Master Teacher Ethics
on:
  push:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/MEMORY_ARCHIVE_THỊT🟠THỔ_SOUL/KINH THÁNH THE MASTER TEACHER/**"
      - "runtime/master_teacher_ethics.py"
      - "tests/test_master_teacher_ethics.py"
      - ".github/workflows/master-teacher-ethics.yml"
  pull_request:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/MEMORY_ARCHIVE_THỊT🟠THỔ_SOUL/KINH THÁNH THE MASTER TEACHER/**"
      - "runtime/master_teacher_ethics.py"
      - "tests/test_master_teacher_ethics.py"
jobs:
  source-bound-ethics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile runtime/master_teacher_ethics.py
      - name: Readback policy
        run: python runtime/master_teacher_ethics.py --repo-root . --check
      - name: Verify eight-vow decisions
        run: python -m unittest discover -s tests -p test_master_teacher_ethics.py -v
