name: DANTE Historical Carrier Regression

on:
  push:
    paths:
      - "CONFIG_SOL/DANTE_SOURCE_RECONCILIATION_CURRENT.json"
      - "runtime/dante_carrier_gate.py"
      - "tests/test_dante_carrier_gate.py"
      - "PLATFORM_SYNC/CURRENT/installed_skill_bodies/skills_270_286.json"
      - ".github/workflows/dante-historical-404-recovery.yml"
  pull_request:
    paths:
      - "CONFIG_SOL/DANTE_SOURCE_RECONCILIATION_CURRENT.json"
      - "runtime/dante_carrier_gate.py"
      - "tests/test_dante_carrier_gate.py"
      - "PLATFORM_SYNC/CURRENT/installed_skill_bodies/skills_270_286.json"
      - ".github/workflows/dante-historical-404-recovery.yml"
jobs:
  verify-no-false-deletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DANTE current gate regression
        run: python -m unittest discover -s tests -p 'test_dante_carrier_gate.py' -v
      - name: DANTE source-state readback
        run: python runtime/dante_carrier_gate.py --repo-root .
