name: SOL spatial direction input
on:
  push:
    branches: [main]
    paths:
      - "runtime/sol_spatial_direction_input.py"
      - "tests/test_sol_spatial_direction_input.py"
      - ".github/workflows/verify-sol-spatial-direction.yml"
  pull_request:
    paths:
      - "runtime/sol_spatial_direction_input.py"
      - "tests/test_sol_spatial_direction_input.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-directions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile parser
        run: python -m py_compile runtime/sol_spatial_direction_input.py
      - name: Test 4 cardinal / 8 ordinal spatial rules
        run: python -m unittest discover -s tests -p "test_sol_spatial_direction_input.py" -v
