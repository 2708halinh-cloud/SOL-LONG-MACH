name: modual-sensor-logs-regression

on:
  push:
    branches:
      - main
      - sol-long-mach-current
    paths:
      - "MODUAL/SENSOR_LOGS/**"
      - ".github/workflows/modual-sensor-logs-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensor-snapshot-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only snapshot privacy and execution-safety regressions
        run: python -m unittest discover -s MODUAL/SENSOR_LOGS/tests -v
