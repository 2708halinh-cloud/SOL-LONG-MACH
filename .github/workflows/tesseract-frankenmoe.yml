name: TESSERACT FrankenMoE preflight
on:
  push:
    branches: [mixtral]
    paths:
      - 'TESSERACT_OS_6D/FRANKENMOE/**'
      - '.github/workflows/tesseract-frankenmoe.yml'
  pull_request:
    branches: [mixtral]
    paths:
      - 'TESSERACT_OS_6D/FRANKENMOE/**'
      - '.github/workflows/tesseract-frankenmoe.yml'
  workflow_dispatch:
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r TESSERACT_OS_6D/FRANKENMOE/requirements.txt
      - run: python -m unittest discover -s TESSERACT_OS_6D/FRANKENMOE -p 'test_*.py' -v
      - name: Verify unresolved model IDs are blocked by preflight
        shell: bash
        run: |
          set +e
          python TESSERACT_OS_6D/FRANKENMOE/validate_config.py
          rc=$?
          set -e
          test "$rc" -eq 1
