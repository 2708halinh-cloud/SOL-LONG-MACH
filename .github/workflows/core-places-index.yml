name: SOL CORE PLACES REALITY INDEX

on:
  push:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/CORE_PLACES_INDEX_MÁU_🔴_HỎA_REALITY/**"
      - "tests/test_core_places_index.py"
      - ".github/workflows/core-places-index.yml"
  pull_request:
    paths:
      - "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/CORE_PLACES_INDEX_MÁU_🔴_HỎA_REALITY/**"
      - "tests/test_core_places_index.py"
      - ".github/workflows/core-places-index.yml"
jobs:
  index-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile index source
        run: python -m py_compile "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/CORE_PLACES_INDEX_MÁU_🔴_HỎA_REALITY/indexer.py"
      - name: Run REALITY INDEX regression tests
        run: python -m unittest discover -s tests -p "test_core_places_index.py" -v
      - name: Fresh inventory and source-path check
        run: |
          python "CHATGPT_LIBRARY/SOL LONG MẠCH - HẬU THIÊN TĨNH/COMPUTER_KHÍ💜BRAIN_OS_POWER/CORE_PLACES_INDEX_MÁU_🔴_HỎA_REALITY/indexer.py" --repo-root . --format markdown --check
