services:
  mcp-gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    networks:
      - gateway
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mcp-gateway:
        condition: service_started
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway
networks:
  gateway:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
